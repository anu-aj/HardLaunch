  {px:128,py:-2, L:[88,66,54],th:48,fill:"#A96F4D",d:0,   closed:[-84,-100,-78],peak:[-20,-10,-8],relax:[-9,-2,2]},
  {px:136,py:18, L:[96,72,58],th:50,fill:"#B0764F",d:.05,closed:[-86,-102,-78],peak:[-12,-9,-7], relax:[-3,1,3]},
  {px:130,py:38, L:[86,64,52],th:48,fill:"#B87B57",d:.10,closed:[-86,-102,-76],peak:[-4,-7,-6],  relax:[3,4,4]},
  {px:118,py:58, L:[66,50,40],th:42,fill:"#C28460",d:.15,closed:[-84,-98,-74], peak:[6,-4,-5],   relax:[10,7,6]}];
FING.forEach(f=>{
  f.g=[];let par=$("fingers"),off=[0,0,0];
  for(let i=0;i<3;i++){
    const th=f.th*(1-.08*i), g=mk("g",{},par);
    mk("rect",{x:-th/2+4,y:-th/2,width:f.L[i]+th/2-4+ (i<2?4:0),height:th,rx:th/2,fill:f.fill},g);
    if(i>0) mk("path",{d:`M 6 ${-th/2+8} Q 9 0 6 ${th/2-8}`,stroke:"#7C4B33","stroke-width":3.5,"stroke-linecap":"round",fill:"none",opacity:.5},g);
    f.g.push(g);par=g;
  }
});
const TH={px:-150,py:-26,L:[78,64],th:56,fill:"#C28460",closed:[10,34],peak:[-60,-22],relax:[-28,-8]};
TH.g=[];{let par=$("thumb");for(let i=0;i<2;i++){const th=TH.th*(1-.1*i),g=mk("g",{},par);
  mk("rect",{x:-th/2+4,y:-th/2,width:TH.L[i]+th/2-4+(i<1?4:0),height:th,rx:th/2,fill:TH.fill},g);
  if(i>0) mk("path",{d:`M 6 ${-th/2+8} Q 9 0 6 ${th/2-8}`,stroke:"#7C4B33","stroke-width":3.5,"stroke-linecap":"round",fill:"none",opacity:.5},g);
  TH.g.push(g);par=g;}}

// ---- layout constants ----
const HX=540, HY=620, HW=170, PALM_Y=HY+88, S=.3;           // heart resting on the palm
const FX=540, FY=450, FW=360;           // heart in the final logo
const RK=1.0;                            // flying rocket scale
const HOLD_Y=HY-130, ACC=1040, T_LIFT=3.0;
const FR_Y=347, FR_S=1.062;              // final rocket placement

// ---- smoke puffs (heart shaped) ----
const COLORS=["#FF86AD","#FFC2D6","#EE578E","#FFE3EC"];
const puffs=[];
for(let i=0,ts=2.78;ts<4.15;i++,ts+=.055){
  const ground=ts<3.35, sgn=i%2?1:-1;
  puffs.push({ts,ground,vx:sgn*(ground?95+34*Math.floor(i/2)+30*R():30+45*R()),vy:ground?-14+20*R():22+24*R(),
              w:ground?70+34*R():44+26*R(),rot0:(R()-.5)*50,spin:(R()-.5)*50,c:COLORS[i%4],life:1.5,
              el:null});
}
puffs.forEach(p=>{const e=document.createElementNS("http://www.w3.org/2000/svg","path");
  e.setAttribute("d",HEART);e.setAttribute("fill",p.c);e.setAttribute("opacity",0);$("smoke").appendChild(e);p.el=e;});

// ---- confetti hearts ----
const conf=[];
for(let i=0;i<10;i++){const e=document.createElementNS("http://www.w3.org/2000/svg","path");
  e.setAttribute("d",HEART);e.setAttribute("fill",COLORS[i%4]);e.setAttribute("opacity",0);$("confetti").appendChild(e);
  conf.push({e,a:(i/10)*Math.PI*2+.3,d:290+80*R(),w:22+14*R(),rot:(R()-.5)*60});}

// ---- rocket path ----
function rocketY(t){
  if(t<2.1) return HY-10;
  if(t<T_LIFT){const p=P(t,2.1,2.7);return lerp(HY-10,HOLD_Y,eOut(p));}
  const tau=t-T_LIFT;return HOLD_Y-.5*ACC*tau*tau;
}

function renderAt(T){
  let t=T-S;
  // ===== hand (timeline uses raw time T; everything after the hand opens is delayed by S) =====
  const hu=eOut(P(T,0,.65)), hv=eIn(P(t,4.0,4.9));
  $("hand").setAttribute("transform",`translate(${(HX-45-180*(1-hu)).toFixed(2)} ${(PALM_Y+220*(1-hu)+hv*430).toFixed(2)})`);
  $("hand").setAttribute("opacity",(P(T,0,.3)*(1-P(t,4.4,4.9))).toFixed(3));
  const ang=(set,d,seg)=>{ // closed -> (flick to) peak -> relax
    const a1=lerp(set.closed[seg],set.peak[seg],eBack(P(T,.78+d,1.45+d)));
    return lerp(a1,set.relax[seg],eInOut(P(T,1.6+d*.5,2.25+d*.5)));};
  FING.forEach(f=>{f.g.forEach((g,i)=>{
    g.setAttribute("transform",(i==0?`translate(${f.px} ${f.py})`:`translate(${f.L[i-1]} 0)`)+` rotate(${ang(f,f.d,i).toFixed(2)})`);});});
  TH.g.forEach((g,i)=>{
    const a1=lerp(TH.closed[i],TH.peak[i],eBack(P(T,.72,1.25)));
    const an=lerp(a1,TH.relax[i],eInOut(P(T,1.6,2.25)));
    g.setAttribute("transform",(i==0?`translate(${TH.px} ${TH.py})`:`translate(${TH.L[0]} 0)`)+` rotate(${an.toFixed(2)})`);});

  // ===== heart =====
  const appear=eBack(P(t,1.05,1.65));
  let bump=0; [1.75,2.05].forEach(b=>bump+=Math.sin(Math.PI*P(t,b,b+.3))*.14);
  const sq=Math.sin(Math.PI*P(t,2.1,2.5));
  const tr=eInOut(P(t,3.95,4.85));
  const hx=lerp(HX,FX,tr), hy=lerp(HY,FY,tr);
  const w=(t<3.95?HW:lerp(HW,FW,eBack(P(t,3.95,4.95))))*Math.max(appear,0)*(1+bump);
  $("heart").setAttribute("transform",heartT(hx,hy,Math.max(w,.01),0,1+.08*sq,1-.12*sq));
  [["rip1",1.75],["rip2",2.05]].forEach(([id,b])=>{
    const u=P(t,b,b+.65);
    $(id).setAttribute("transform",heartT(HX,HY,HW*(1+.7*eOut(u))));
    $(id).setAttribute("opacity",(u>0&&u<1)?(.6*(1-u)).toFixed(3):0);
  });
  $("glow").setAttribute("opacity",(P(t,4.7,5.4)).toFixed(3));

  // ===== flying rocket =====
  const ry=rocketY(t), pe=P(t,2.1,2.7);
  const rs=RK*lerp(.12,1,eBack(pe));
  const amp=3.5*P(t,2.7,2.85)*(1-P(t,3.0,3.15))+ (t>3.15?1.5:0);
  const rx=HX+Math.sin(t*80)*amp;
  const vis=(t>2.1&&ry>-280)?1:0;
  $("rocket1").setAttribute("opacity",vis);
  $("rocket1").setAttribute("transform",`translate(${rx.toFixed(2)} ${ry.toFixed(2)}) scale(${rs.toFixed(4)})`);
  const v=ACC*Math.max(0,t-T_LIFT);
  const fl=(P(t,2.75,3.0)*.9+Math.min(1.4,v/700)+.1*Math.sin(t*55))*(t>2.75?1:0);
  $("r1flame").setAttribute("transform",`translate(0 68) scale(${(1+.22*Math.min(Math.max(fl,0),1.5)).toFixed(3)} ${Math.max(fl,.01).toFixed(3)}) translate(0 -68)`);
  $("r1port").setAttribute("transform",heartT(0,-28,46));

  // ===== smoke =====
  puffs.forEach(p=>{
    const age=t-p.ts, u=age/p.life;
    if(age<0||u>1){p.el.setAttribute("opacity",0);return;}
    const sx=HX, sy=rocketY(p.ts)+68*RK;
    const e=eOut(clamp(age/.9));
    const x=sx+p.vx*e, y=sy+p.vy*age*1.3+ (p.ground?0:age*14);
    const s=p.w*(.3+1.0*eOut(clamp(age/.5))+.45*u);
    p.el.setAttribute("transform",heartT(x,y,s,p.rot0+p.spin*age));
    p.el.setAttribute("opacity",(Math.pow(1-u,1.5)*.95).toFixed(3));
  });

  // ===== final rocket =====
  const pf=P(t,5.05,5.7);
  $("rocket2").setAttribute("opacity",t>5.05?1:0);
  $("rocket2").setAttribute("transform",`translate(540 ${lerp(FY,FR_Y,eOut(pf)).toFixed(2)}) scale(${(FR_S*lerp(.1,1,eBack(pf))).toFixed(4)})`);
  $("r2flame").setAttribute("transform",`translate(0 68) scale(1 ${Math.max(pf*(.75+.12*Math.sin(t*40)),.01).toFixed(3)}) translate(0 -68)`);

  // ===== confetti =====
  conf.forEach(c=>{
    const u=eOut(P(t,4.9,5.6)), op=P(t,5.0,5.1)*(1-P(t,5.2,5.9));
    c.e.setAttribute("transform",heartT(FX+Math.cos(c.a)*(150+(c.d-150)*u),FY+Math.sin(c.a)*(150+(c.d-150)*u),c.w*(.5+.5*u),c.rot));
    c.e.setAttribute("opacity",op.toFixed(3));
  });

  // ===== wordmark =====
  const a=eOut(P(t,5.55,6.15)), b=eOut(P(t,5.7,6.3)), c=P(t,6.2,6.8);
  $("wmHard").setAttribute("opacity",a.toFixed(3));$("wmHard").setAttribute("transform",`translate(${WM.hard.x} ${(WM.hard.y+(1-a)*40).toFixed(2)})`);
  $("wmLaunch").setAttribute("opacity",b.toFixed(3));$("wmLaunch").setAttribute("transform",`translate(${WM.launch.x} ${(WM.launch.y+(1-b)*40).toFixed(2)})`);
  $("tag").setAttribute("opacity",c.toFixed(3));$("tag").setAttribute("transform",`translate(${WM.tag.x} ${WM.tag.y})`);
}
window.renderAt=renderAt; window.DUR=DUR;

// ---- live playback (skipped when capturing frames) ----
if(!location.search.includes("capture")){
  let t0=performance.now();
  const tick=now=>{renderAt(Math.min(DUR,((now-t0)/1000)%LOOP));requestAnimationFrame(tick)};
  $("stage").addEventListener("click",()=>{t0=performance.now()});
  requestAnimationFrame(tick);
} else renderAt(0);
</script>
</body>
</html>
